<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111936" />
      <stop offset="100%" stop-color="#080a14" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -1px; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }
      
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbit {
        from { transform: rotate(0deg) translateX(45px) rotate(0deg); }
        to { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
      }

      .floating-card-1 { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .floating-card-2 { animation: floatSlow 9s ease-in-out infinite reverse; transform-origin: center; }
      .orb-glow { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .flowing-stream { stroke-dasharray: 6 12; animation: dataFlow 2.5s linear infinite; }
      .orbiting-dot { animation: orbit 10s linear infinite; transform-origin: 980px 170px; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)" />
  <rect width="1198" height="358" x="1" y="1" rx="19" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Animated Ambient Orbs in Background -->
  <circle cx="180" cy="90" r="130" fill="#6366f1" opacity="0.22" filter="url(#glow)" class="orb-glow" />
  <circle cx="1020" cy="240" r="140" fill="#a855f7" opacity="0.2" filter="url(#glow)" class="orb-glow" style="animation-delay: -3s;" />
  <circle cx="600" cy="40" r="90" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="orb-glow" style="animation-delay: -1.5s;" />

  <!-- Background Animated Data Stream Grids / Connecting Circuits -->
  <g opacity="0.35">
    <path d="M 700 80 L 820 80 L 880 140 L 1050 140" fill="none" stroke="#6366f1" stroke-width="1.5" class="flowing-stream" />
    <path d="M 750 290 L 890 290 L 940 230 L 1110 230" fill="none" stroke="#a855f7" stroke-width="1.5" class="flowing-stream" style="animation-duration: 3.5s;" />
    <path d="M 820 80 L 820 220 L 900 290" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flowing-stream" style="animation-duration: 4s;" />
  </g>

  <!-- Decorative Interactive Floating Tech Badges (Right side background, never overlapping title) -->
  <g class="floating-card-1">
    <g transform="translate(880, 50)">
      <rect width="240" height="80" rx="14" fill="url(#cardGlow)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="35" cy="40" r="16" fill="#6366f1" fill-opacity="0.2" />
      <text x="35" y="45" text-anchor="middle" fill="#818cf8" font-size="16" font-family="sans-serif">⚡</text>
      <text x="65" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">API-First Core</text>
      <text x="65" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">REST • GraphQL • MCP</text>
    </g>
  </g>

  <g class="floating-card-2">
    <g transform="translate(850, 160)">
      <rect width="270" height="95" rx="14" fill="url(#cardGlow)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="35" cy="48" r="16" fill="#a855f7" fill-opacity="0.2" />
      <text x="35" y="53" text-anchor="middle" fill="#c084fc" font-size="16" font-family="sans-serif">📦</text>
      <text x="65" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Composable Content</text>
      <text x="65" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">Self-Hosted &amp; Managed DBs</text>
      <text x="65" y="74" fill="#38bdf8" font-family="monospace" font-size="10">Postgres • SQLite • Mongo</text>
    </g>
  </g>

  <!-- Orbiting dynamic node -->
  <circle cx="980" cy="170" r="4" fill="#38bdf8" filter="url(#glow)" class="orbiting-dot" />

  <!-- Foreground Content: Stays Crisp, Highly Legible, Never Obscured -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Badge -->
    <rect width="245" height="30" rx="15" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="15" r="4" fill="#34d399" />
    <text x="26" y="20" class="pill-text">CURATED ARCHITECTURE LIST</text>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="90" class="title">Awesome Headless CMS</text>
    <text x="545" y="90" class="title" fill="url(#accent)">&amp; Backend</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="130" class="tagline">Next-Gen API-First Content Engines, Headless Studios &amp; Self-Hosted BaaS</text>

    <!-- Interactive Filter Badges in Foreground -->
    <g transform="translate(0, 165)">
      <!-- Badge 1 -->
      <rect width="125" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="pill-text">🚀 SaaS Platforms</text>

      <!-- Badge 2 -->
      <rect x="137" width="155" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="153" y="22" class="pill-text">⭐ Open Source repos</text>

      <!-- Badge 3 -->
      <rect x="304" width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="320" y="22" class="pill-text">🤖 AI &amp; MCP Ready</text>

      <!-- Badge 4 -->
      <rect x="451" width="145" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="467" y="22" class="pill-text">⚡ Realtime APIs</text>
    </g>
  </g>
</svg>
